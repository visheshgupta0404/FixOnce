[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixonce"
version = "0.1.0"
description = "On-call agent that remembers past incidents (Meko). Runs inside your own infrastructure."
requires-python = ">=3.11"
authors = [{ name = "Vedansh Mathur" }, { name = "Vishal Verma" }, { name = "Vishesh Gupta" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8.0", "google-genai>=1.0"]

[project.urls]
Source = "https://github.com/visheshgupta0404/FixOnce"

[project.scripts]
fixonce = "fixonce.cli:main"

[tool.setuptools.packages.find]
include = ["fixonce*"]

[tool.setuptools.package-data]
fixonce = ["web/*.html"]
