services:
  shop:
    build: { context: ., dockerfile: shop/Dockerfile }
    ports: ["8001:8001"]
    env_file: .env
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["8000:8000"]
    env_file: .env
    environment:
      SHOP_URL: http://shop:8001
    depends_on: [shop]
  # Optional (Teammate B): live state in YugabyteDB. Start with: docker compose --profile yb up
  yugabytedb:
    profiles: ["yb"]
    image: yugabytedb/yugabyte:latest
    command: ["bin/yugabyted", "start", "--background=false"]
    ports: ["5433:5433", "15433:15433"]
